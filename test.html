<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
  </head>
  <body>
    <fieldset>
      <legend>Student Registration Form</legend>
            <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
      <br><br>

      <label for="pass">Password:</label>
      <input type="password" id="pass" name="password" required>
      <br><br>
    

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" placeholder="Enter your age">
      <br><br>
      
      <label for date="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob">
      <br><br>


      <label for="gender">Gender:</label>
      <input type="radio" id="male" name="gender" value="male">male
      <input type="radio" id="female" name="gender" value="female">female 
      <input type="radio" id="other" name="gender" value="other">other
      <br><br>  

      <label for="city" >City:</label>
      <select id="city" name="city">
        <option value="dhaka">Dhaka</option>
        <option value="chittagong">Chittagong</option>
        <option value="khulna">Khulna</option>
        <option value="rajshahi">Rajshahi</option>
      </select>
      <br><br>  

      <label for="hobbies">Hobbies:</label>
      <input type="checkbox" id="reading" name="hobbies" value="reading">reading
      <input type="checkbox" id="Cricket" name="hobbies" value="Cricket">cricket
      <input type="checkbox" id="Music" name="hobbies" value=" Music">Music
      <br><br>

      <label for="Describe Yourself" >Describe Yourself:</label><br>
      <textarea id="about" name="about" rows="4" cols="50" placeholder="Write something about yourself..."></textarea>
      <br><br>


      <label for="submit"> </label>
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
      <br><br>


    </form> 
  </body>
</html>
